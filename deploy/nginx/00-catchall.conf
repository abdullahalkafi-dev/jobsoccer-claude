# Catch-all for unknown host names. DNS has a wildcard (*.jobsoccer.com -> this server),
# so without this block an unknown name would be served by the first site Nginx loads.
# Install as /etc/nginx/conf.d/00-catchall.conf
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
