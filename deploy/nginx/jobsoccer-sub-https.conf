# Step 2: HTTPS sites (install after the certificate exists):
#   /etc/nginx/conf.d/jobsoccer-sub-https.conf
# dev / admin-dev / admin use the same basic-auth login as the live site (/etc/nginx/.htpasswd).
# Staging (dev, api-dev, admin-dev) is also hidden from search engines.

# ---- staging website -> 127.0.0.1:3100
server {
    listen 443 ssl;
    server_name dev.jobsoccer.com;

    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    ssl_certificate /etc/letsencrypt/live/jobsoccer-sub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobsoccer-sub/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ---- staging API (no basic auth: the browser calls it from the website) -> 127.0.0.1:8100
server {
    listen 443 ssl;
    server_name api-dev.jobsoccer.com;

    client_max_body_size 200m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    ssl_certificate /etc/letsencrypt/live/jobsoccer-sub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobsoccer-sub/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}

