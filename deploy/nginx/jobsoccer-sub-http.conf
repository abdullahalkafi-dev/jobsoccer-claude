# Step 1 for the sub-domains: plain HTTP only (certificate challenge + redirect).
# Install as /etc/nginx/conf.d/jobsoccer-sub-http.conf, then:
#   mkdir -p /var/www/certbot
#   certbot certonly --webroot -w /var/www/certbot --cert-name jobsoccer-sub \
#     -d dev.jobsoccer.com -d api-dev.jobsoccer.com -d admin-dev.jobsoccer.com -d admin.jobsoccer.com
server {
    listen 80;
    server_name dev.jobsoccer.com api-dev.jobsoccer.com admin-dev.jobsoccer.com admin.jobsoccer.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
