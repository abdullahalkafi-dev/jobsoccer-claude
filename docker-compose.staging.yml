# Staging stack (dev.jobsoccer.com) - runs the `ai-workflow` branch next to the live site.
# Separate project name, containers, network, volume and ports from docker-compose.prod.yml.
# Ports bind to 127.0.0.1; Nginx exposes dev / api-dev / admin-dev (see deploy/staging/nginx).
# Live site ports: 3000 / 8000 / 4000. Staging ports: 3100 / 8100 / 4100.
#
# Run from /var/www/jobsoccer-staging (a separate clone; never from the live folder):
#   docker compose -f docker-compose.staging.yml up -d --build
name: jobsoccer_staging

services:
  redis:
    image: redis:7-alpine
    container_name: jobsoccer_redis_staging
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_staging_data:/data
    networks:
      - jobsoccer_staging_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # MongoDB next to the backend (single-node replica set: the app uses transactions).
  # Why: the Atlas clusters are ~270 ms away from this server (Kansas), so every query cost 0.27 s.
  # Data = a copy of the dev database (jobsoccer_dev); the Atlas dev copy is kept untouched as a backup.
  # Roll back: remove the DATABASE_URL line from the backend service (it then uses the Atlas URL from .env again).
  mongo:
    image: mongo:7
    container_name: jobsoccer_mongo_staging
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - mongo_staging_data:/data/db
    mem_limit: 1g
    networks:
      - jobsoccer_staging_network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }\" | grep -q 1"]
      # mongosh is a Node program: each check costs ~1 s of a full CPU. Check every 5 s while
      # starting (so the backend can start quickly), then once a minute.
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s

  # S3-compatible file storage (SeaweedFS). Keys come from S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY
  # in the backend .env (run compose with --env-file backend/claude_job_soccer_backend/.env).
  # The S3 port is bound to 127.0.0.1; Nginx exposes it only under api-dev.jobsoccer.com/jobsoccer/.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: jobsoccer_seaweedfs_staging
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=1024
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    ports:
      - "127.0.0.1:8433:8333"
    volumes:
      - seaweedfs_staging_data:/data
    mem_limit: 768m
    networks:
      - jobsoccer_staging_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend/claude_job_soccer_backend
      dockerfile: Dockerfile
    container_name: jobsoccer_backend_staging
    restart: unless-stopped
    env_file:
      - ./backend/claude_job_soccer_backend/.env
    environment:
      - NODE_ENV=production
      - APP_ENV=staging
      - PORT=8000
      - DATABASE_URL=mongodb://mongo:27017/jobsoccer_dev?replicaSet=rs0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_FORCE_PATH_STYLE=true
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    mem_limit: 1g
    networks:
      - jobsoccer_staging_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: https://api-dev.jobsoccer.com
        NEXT_PUBLIC_HOSTNAME: api-dev.jobsoccer.com
        NEXT_PUBLIC_PORT: "8000"
        NEXT_PUBLIC_SOCKET_URL: https://api-dev.jobsoccer.com
        NEXT_PUBLIC_ADMIN_URL: https://admin-dev.jobsoccer.com
    container_name: jobsoccer_frontend_staging
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "127.0.0.1:3100:3000"
    mem_limit: 512m
    networks:
      - jobsoccer_staging_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  admin_dashboard:
    build:
      context: ./admin_dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: https://api-dev.jobsoccer.com
        NEXT_PUBLIC_HOSTNAME: api-dev.jobsoccer.com
        NEXT_PUBLIC_PORT: "8000"
    container_name: jobsoccer_dashboard_staging
    restart: unless-stopped
    env_file:
      - ./admin_dashboard/.env
    ports:
      - "127.0.0.1:4100:4000"
    mem_limit: 512m
    networks:
      - jobsoccer_staging_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  seaweedfs_staging_data:
  redis_staging_data:
  mongo_staging_data:

networks:
  jobsoccer_staging_network:
    driver: bridge
